[theme]
# Dirección creativa "Atardecer llanero" (las tipografías se cargan en componentes/tema.py)
base = "light"
primaryColor = "#E4572E"
backgroundColor = "#EEF0F5"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1A1C33"
font = "sans serif"

[server]
# sirve frontend/static/ en app/static/ (paisaje del pie de página)
enableStaticServing = true

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
